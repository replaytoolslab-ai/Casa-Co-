name: Cloudflare AI migration checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/prompt-04-mobile-profile-vision]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Cloudflare AI unit tests
        run: bunx tsx --test api/_lib/cloudflare-ai.test.ts
      - name: Type-check
        run: bun run lint
      - name: Build
        run: bun run build
