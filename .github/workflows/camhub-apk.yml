name: CamHub Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - camhub-apk-test
    paths:
      - "CamHub-test/**"
      - ".github/workflows/camhub-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract CamHub project
        run: |
          test -f CamHub-test/CamHub.zip
          mkdir -p "$RUNNER_TEMP/camhub"
          unzip -q CamHub-test/CamHub.zip -d "$RUNNER_TEMP/camhub"

      - name: Build debug APK
        run: gradle -p "$RUNNER_TEMP/camhub/CamHub" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CamHub-debug-apk
          path: "$RUNNER_TEMP/camhub/CamHub/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
