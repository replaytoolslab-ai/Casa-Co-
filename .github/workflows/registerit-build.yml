name: Build Register.it static site
concurrency:
  group: registerit-preview-deploy
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches:
      - deploy/registerit-php
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/registerit-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: PHP syntax check
        run: php -l api/index.php
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build for preview subdirectory
        run: npm run build -- --base=/preview/
      - name: Prevent stale browser cache for the preview
        run: |
          cat > dist/.htaccess <<'HTACCESS'
          <IfModule mod_headers.c>
            <FilesMatch "^(index\\.html|.*\\.html)$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
              Header set Pragma "no-cache"
              Header set Expires "0"
            </FilesMatch>
          </IfModule>
          HTACCESS
      - uses: actions/upload-artifact@v4
        with:
          name: faidatecasa-registerit-preview
          path: dist/
          retention-days: 7
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Publish preview to Register.it via passive FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'LFTP'
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set ftp:ssl-allow false
          set net:max-retries 3
          set net:timeout 30
          set net:reconnect-interval-base 5
          mirror --reverse --transfer-all --verbose --exclude-glob categories --exclude-glob 'categories/**' dist/ ./preview/
          bye
          LFTP
