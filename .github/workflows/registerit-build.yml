name: Build Register.it static site
on:
  workflow_dispatch:
  push:
    branches:
      - deploy/registerit-php
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/registerit-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: PHP syntax check
        run: php -l api/index.php
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build for preview subdirectory
        run: npm run build -- --base=/preview/
      - uses: actions/upload-artifact@v4
        with:
          name: faidatecasa-registerit-preview
          path: dist/
          retention-days: 7
      - name: Publish preview to Register.it via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ./preview/
          local-dir: ./dist/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            assets/categories/**
