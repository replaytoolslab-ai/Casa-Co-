name: Build and publish FaiDaTeCasa on Register.it
concurrency:
  group: registerit-main-deploy
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/registerit-build.yml'
      - 'public/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: PHP syntax check
        run: php -l api/index.php
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build for the domain root
        run: npm run build -- --base=/
      - name: Configure SPA routing and safe browser caching
        run: |
          cat > dist/.htaccess <<'HTACCESS'
          DirectoryIndex index.html index.php
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteRule ^api/ - [L]
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]
            RewriteRule ^ index.html [L]
          </IfModule>
          <IfModule mod_headers.c>
            <FilesMatch "^(index\\.html|.*\\.html)$">
              Header set Cache-Control "no-cache, no-store, must-revalidate"
              Header set Pragma "no-cache"
              Header set Expires "0"
            </FilesMatch>
          </IfModule>
          HTACCESS
      - uses: actions/upload-artifact@v4
        with:
          name: faidatecasa-main-site
          path: dist/
          retention-days: 14
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Inspect FTP directories to identify the live document root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'LFTP'
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set ftp:ssl-allow false
          set net:max-retries 3
          set net:timeout 30
          pwd
          cls -la
          cls -la www
          cls -la public_html
          cls -la htdocs
          cls -la preview
          bye
          LFTP
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faidatecasa-wordpress-root-backup
          path: root-backup/
          if-no-files-found: ignore
          retention-days: 30
