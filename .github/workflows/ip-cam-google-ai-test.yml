name: IP CAM PRIVATE - Google AI Studio APK test

on:
  push:
    branches: [ip-cam-private-google-ai-test]
    paths:
      - 'ip-cam-private.zip'
      - '.github/workflows/ip-cam-google-ai-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-google-ai-project:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: ip-cam-private-google-ai-test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify optimized Android source tree
        run: |
          test -f ip-cam-private/settings.gradle.kts
          test -f ip-cam-private/app/src/main/java/com/example/MainActivity.kt
          grep -q 'Size(1280, 720)' ip-cam-private/app/src/main/java/com/example/camera/CameraManager.kt
          grep -q '2_500_000' ip-cam-private/app/src/main/java/com/example/network/H264StreamEncoder.kt
          echo "Optimized IP CAM PRIVATE source verified."

      - name: Create debug signing key
        working-directory: ip-cam-private
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Compile and run unit tests from Google AI Studio source
        run: |
          gradle --no-daemon -p ip-cam-private clean testDebugUnitTest assembleDebug --stacktrace

      - name: Verify generated APK
        run: |
          APK="ip-cam-private/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload Google AI Studio test APK
        uses: actions/upload-artifact@v4
        with:
          name: ip-cam-private-google-ai-studio-test-apk
          path: ip-cam-private/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
